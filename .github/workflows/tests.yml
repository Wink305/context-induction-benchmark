name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run tests (zero dependencies)
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v

      - name: Regeneration must be byte-identical
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        env:
          PYTHONPATH: src
        run: |
          python -m context_benchmark generate --config configs/generator.json
          # Only the six generator-written files are frozen. self_check.json is a
          # scorer artefact and is gated separately by the freshness step below.
          git diff --exit-code -- \
            data/pilot_v0/tasks.jsonl \
            data/pilot_v0/candidate_truth.jsonl \
            data/pilot_v0/annotation_worksheet.jsonl \
            data/pilot_v0/calibration_ids.json \
            data/pilot_v0/coverage.json \
            data/pilot_v0/manifest.json
          echo "deterministic: regeneration produced no changes"

      - name: Extension set regeneration must be byte-identical
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        env:
          PYTHONPATH: src
        run: |
          python -m context_benchmark generate --config configs/generator.v1.json
          git diff --exit-code -- data/contrib/pilot-v1-randomized
          echo "deterministic: extension set regeneration produced no changes"
      - name: Extension set must pass the audit and the submission contract
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        env:
          PYTHONPATH: src
        run: |
          python -m context_benchmark audit \
            --candidate data/contrib/pilot-v1-randomized/candidate_truth.jsonl \
            --output "$RUNNER_TEMP/audit_v1.json" > /dev/null
          python - <<'PY'
          import json, sys
          report = json.load(open("$RUNNER_TEMP/audit_v1.json", encoding="utf-8"))
          print(f"clean {report['clean_unit_n']} / {report['unit_n']}")
          if report["severity_counts"]:
              sys.exit(f"audit findings present: {report['severity_counts']}")
          PY
          python -m context_benchmark validate-submission --dir data/contrib/pilot-v1-randomized

      - name: Audit must stay clean
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        env:
          PYTHONPATH: src
        run: |
          python -m context_benchmark audit --candidate data/pilot_v0/candidate_truth.jsonl --output audit.json
          python - <<'PY'
          import json, sys
          report = json.load(open("audit.json", encoding="utf-8"))
          print(f"clean {report['clean_unit_n']} / {report['unit_n']}")
          if report["severity_counts"]:
              sys.exit(f"audit findings present: {report['severity_counts']}")
          PY

      - name: Self-check discrimination gate
        env:
          PYTHONPATH: src
        run: python -m context_benchmark self-check --candidate data/pilot_v0/candidate_truth.jsonl

      - name: Committed self-check artifact must match a fresh run
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        env:
          PYTHONPATH: src
        run: |
          python -m context_benchmark self-check \
            --candidate data/pilot_v0/candidate_truth.jsonl \
            --output "$RUNNER_TEMP/self_check.json" > /dev/null
          python - <<'PY'
          import json, sys
          fresh = json.load(open("$RUNNER_TEMP/self_check.json", encoding="utf-8"))
          committed = json.load(open("data/pilot_v0/self_check.json", encoding="utf-8"))
          for key in ("scorer_version", "matcher_version", "oracle_aggregate",
                      "negative_control_aggregates", "discrimination_check"):
              if key in committed and committed[key] != fresh[key]:
                  sys.exit(f"committed self_check.json is stale for key {key!r}: "
                           f"committed={committed[key]!r} fresh={fresh[key]!r}")
          print("self-check artifact is in sync with the installed scorer")
          PY

      - name: Documentation numbers must match the repository
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: python scripts/check_docs.py

      - name: Human annotation chain runs end to end
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        env:
          PYTHONPATH: src
        run: |
          python -m unittest tests.test_annotation_pipeline -v
          python -m context_benchmark make-sheets \
            --worksheet data/pilot_v0/annotation_worksheet.jsonl \
            --out-dir "$RUNNER_TEMP/sheets_A" --annotator A > /dev/null
          python - <<'PY'
          import pathlib, sys
          sheets = sorted(pathlib.Path("$RUNNER_TEMP/sheets_A").glob("*.md"))
          if not sheets:
              sys.exit("no sheets were rendered")
          for path in sheets:
              text = path.read_text(encoding="utf-8")
              answer = text.split("<!-- ANSWER_START -->", 1)[1].split("<!-- ANSWER_END -->", 1)[0]
              if answer.strip():
                  sys.exit(f"{path.name} already contains answers")
          print(f"{len(sheets)} answer-free sheets rendered")
          PY

      - name: Attribution axes E/F run end-to-end
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        env:
          PYTHONPATH: src
        run: |
          python -m context_benchmark run-r2 --limit 3 --output "$RUNNER_TEMP/f_trace.jsonl" > /dev/null
          python -m context_benchmark run-survival-trace --limit 3 \
            --truth data/pilot_v0/candidate_truth.jsonl \
            --output "$RUNNER_TEMP/e_trace.jsonl" > /dev/null
          python -m context_benchmark survival \
            --input "$RUNNER_TEMP/e_trace.jsonl" --output "$RUNNER_TEMP/e_report.json" > /dev/null
          python - <<'PY'
          import json, sys
          e = json.load(open("$RUNNER_TEMP/e_report.json", encoding="utf-8"))
          f = [json.loads(l) for l in open("$RUNNER_TEMP/f_trace.jsonl", encoding="utf-8")]
          assert e.get("session_n", 0) > 0, e
          assert len(f) == 3 and all(row.get("compression") is False for row in f), f
          print(f"E session records: {e['session_n']}; F no-compression traces: {len(f)}")
          PY

      - name: Submission contract stays valid
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        env:
          PYTHONPATH: src
        run: |
          python -m context_benchmark dimensions > /dev/null
          python -m context_benchmark run-induction \
            --runtime configs/runtime.json \
            --tasks data/pilot_v0/tasks.jsonl \
            --prompt prompts/induction_v1.txt \
            --output "$RUNNER_TEMP/cib_preds.jsonl" \
            --logs "$RUNNER_TEMP/cib_calls.jsonl" \
            --manifest "$RUNNER_TEMP/cib_submission" \
            --contributor "ci" --dimensions A C D > /dev/null
          python -m context_benchmark validate-submission --dir "$RUNNER_TEMP/cib_submission"

      - name: Tampered submission must be rejected
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        env:
          PYTHONPATH: src
        run: |
          cp -r "$RUNNER_TEMP/cib_submission" "$RUNNER_TEMP/cib_tampered"
          python - <<'PY'
          import json, pathlib
          p = pathlib.Path("$RUNNER_TEMP/cib_tampered/submission.json")
          d = json.loads(p.read_text(encoding="utf-8"))
          # Flip a core evidence hash: changing the scorer must invalidate the run.
          d["evidence"]["src/context_benchmark/scoring.py"] = "0" * 64
          p.write_text(json.dumps(d, ensure_ascii=False, indent=2), encoding="utf-8")
          PY
          if python -m context_benchmark validate-submission --dir "$RUNNER_TEMP/cib_tampered"; then
            echo "ERROR: tampered submission was accepted" >&2
            exit 1
          fi
          echo "tamper gate: tampered submission correctly rejected"
