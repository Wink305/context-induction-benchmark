[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "context-benchmark"
version = "0.4.0"
description = "Reproducible harness for customer-service constraint induction evaluation"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
context-benchmark = "context_benchmark.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
